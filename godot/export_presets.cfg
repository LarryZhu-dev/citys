[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="art/nature/terrain-*.webp"
export_path="../engine-web/game.html"

[preset.0.options]
custom_template/debug="../work/godot-toolchain/templates/web_nothreads_debug.zip"
