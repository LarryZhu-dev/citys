<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17271f">
  <meta name="description" content="万城纪：以 Godot 构筑的华夏古城经营游戏。营造街巷、经营产业，与其他城主交易。">
  <title>万城纪 · 华夏</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/online.css">
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="万城纪城市地图；拖动平移，双指缩放，在营造菜单选择建筑后点击地面放置">此游戏需要支持 WebGL 2 的浏览器。</canvas>
  <div id="boot" role="status"><div class="boot-seal">万<br>城<br>纪</div><h1>山河为卷，落木成城</h1><p id="bootMessage">正在展开华夏山河…</p><progress id="bootProgress" max="100" value="0"></progress><small>首次载入需要下载引擎和画卷，之后将使用浏览器缓存。</small><button id="bootRetry" hidden>重新载入</button></div>
  <div id="onlineModal"></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <canvas id="cv" width="1" height="1" hidden aria-hidden="true"></canvas>
  <noscript>请启用 JavaScript 后游玩万城纪。</noscript>
  <script src="/js/data.js"></script>
  <script src="/js/civilizations.js"></script>
  <script src="/js/simulation.js"></script>
  <script src="/js/godot-bridge.js"></script>
  <script src="/js/online.js"></script>
  <script src="/engine-web/game.js"></script>
  <script src="/js/godot-loader.js"></script>
</body>
</html>
